[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embyx-manager"
version = "0.1.0"
description = "Unified web management and monitoring for embyx media workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30,<1",
  "colorlog>=6.9,<7",
  "defusedxml>=0.7,<1",
  "fastapi>=0.116,<1",
  "grpcio>=1.76,<2",
  "httpx>=0.28,<1",
  "humanfriendly>=10.0,<11",
  "nyaapy>=0.7,<1",
  "protobuf>=6.31,<7",
  "pydantic>=2.11,<3",
  "pyquery>=2.0,<3",
  "tenacity>=9.1,<10",
  "uvicorn>=0.35,<1",
  "watchdog>=6.0,<7",
]

[project.scripts]
embyx-manager = "embyx_manager.__main__:main"

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embyx_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
  "src/embyx_manager/clients/clouddrive/clouddrive_pb2.py",
  "src/embyx_manager/clients/clouddrive/clouddrive_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",       # Docstrings are optional.
  "COM812",  # Conflicts with the formatter.
  "Q000",    # The formatter enforces single quotes.
  "Q003",    # The formatter enforces single quotes.
  "CPY001",  # No copyright headers in this project.
  "ANN401",  # Any is acceptable at gRPC/protobuf boundaries.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "S101",
  "S105",  # Fake tokens in fixtures.
  "S106",
  "ISC004",
]
# Interim port from embyx-web; replaced by the PostgreSQL repository.
"src/embyx_manager/fill_actor/sqlite_repository.py" = [
  "PLR0917",
  "RUF036",
  "ISC004",
]

[tool.ruff.format]
quote-style = "single"
