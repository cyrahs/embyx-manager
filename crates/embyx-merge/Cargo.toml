[package]
name = "embyx-merge"
description = "Multi-part merges of embyx-manager: detection, tasks, service, auto-merge and the merge-worker body"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
embyx-clients = { workspace = true, optional = true, features = ["clouddrive"] }
embyx-core.workspace = true
embyx-db = { workspace = true, optional = true }
regex.workspace = true
sha1.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt", "fs"] }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
tracing = { workspace = true, optional = true }

[features]
default = ["db"]
# The merge tasks in PostgreSQL (`tasks`). The merge-worker body needs no database, and the
# binary leaves this out so it still builds on Windows, where `embyx-db` does not (WP15).
# The service, auto-merge and transcode bookkeeping need the database, CloudDrive and the Job
# API, so they live behind it too (WP14).
db = ["dep:embyx-db", "dep:sqlx", "dep:embyx-clients", "dep:tokio", "dep:tokio-util", "dep:tracing"]
test-support = ["db", "embyx-db/test-support", "embyx-clients/test-support"]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
embyx-merge = { path = ".", features = ["test-support"] }
embyx-clients = { workspace = true, features = ["clouddrive", "test-support"] }
embyx-db = { workspace = true, features = ["test-support"] }
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
