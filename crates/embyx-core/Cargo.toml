[package]
name = "embyx-core"
description = "Env settings, AVID parser, config models and the Python-compatible helpers of embyx-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The golden-file reader and the effect-transcript harness, for other crates' tests.
test-support = ["dep:sha2", "dep:hex", "dep:tempfile", "dep:toml"]

[dependencies]
chrono.workspace = true
fancy-regex.workspace = true
hex = { workspace = true, optional = true }
regex.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
toml = { workspace = true, optional = true }
unicode-normalization.workspace = true

[dev-dependencies]
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
