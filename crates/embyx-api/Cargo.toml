[package]
name = "embyx-api"
description = "HTTP API of embyx-manager: routers, auth, health, SPA hosting and the transcode listener"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The scenario harness's fakes, for the effect-transcript tests.
test-support = ["embyx-clients/test-support", "embyx-db/test-support", "embyx-core/test-support"]

[dependencies]
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
embyx-clients = { workspace = true, features = ["clouddrive"] }
embyx-core.workspace = true
embyx-db.workspace = true
futures-util = { workspace = true, features = ["std"] }
getrandom.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
md-5.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tower-service.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
embyx-api = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
