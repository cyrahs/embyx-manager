[package]
name = "embyx-clients"
description = "HTTP client factory and the external services of embyx-manager: JavBus, sukebei, AVBase, jinjier, Emby, feeds, CloudDrive, Kubernetes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["clouddrive"]
# The CloudDrive gRPC client (tonic). Off for builds that must not carry gRPC.
clouddrive = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types", "dep:tokio-util"]
# The fake web (`net::fakeweb`) and the scenario fake CloudDrive (`clouddrive::fake`).
test-support = ["dep:rcgen", "dep:prost-reflect", "dep:tokio-stream", "embyx-core/test-support"]

[dependencies]
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
embyx-core.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
reqwest = { workspace = true, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "cookies",
    "gzip",
    "deflate",
    "brotli",
    "socks",
    # `Response::bytes_stream()` in `net::httpx::stream_body_to`.
    "stream",
] }
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time", "rt", "macros", "process", "net"] }
tokio-rustls.workspace = true
tonic = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic-prost = { workspace = true, optional = true }
url.workspace = true

[build-dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
axum.workspace = true
chrono.workspace = true
embyx-db = { workspace = true, features = ["test-support"] }
# The integration tests use the scenario fake (`clouddrive::fake`).
embyx-clients = { path = ".", features = ["test-support"] }
embyx-core = { workspace = true, features = ["test-support"] }
hex.workspace = true
rcgen.workspace = true
scraper.workspace = true
sqlx.workspace = true
prost-reflect.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
wreq.workspace = true
wreq-util.workspace = true
