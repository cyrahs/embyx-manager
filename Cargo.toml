# Cargo workspace for the Rust rewrite of embyx-manager. See docs/rewrite/PLAN.md.
#
# The Python tree next to it (src/, tests/, frontend/, ...) is the reference and stays
# byte-identical to the commit in BASELINE until the cleanup after the switch.
#
# Crates whose API coverage WP0 checked (docs/rewrite/API-COVERAGE.md) carry a comment saying
# so; read that file before changing their version. Everything else uses a caret requirement
# and is fixed by Cargo.lock.

[workspace]
resolver = "3"
members = [
    "crates/embyx-core",
    "crates/embyx-db",
    "crates/embyx-clients",
    "crates/embyx-monitor",
    "crates/embyx-fill-actor",
    "crates/embyx-merge",
    "crates/embyx-transcode-worker",
    "crates/embyx-api",
    "crates/embyx-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates.
embyx-core = { path = "crates/embyx-core" }
embyx-db = { path = "crates/embyx-db" }
embyx-clients = { path = "crates/embyx-clients", default-features = false }
embyx-monitor = { path = "crates/embyx-monitor" }
embyx-fill-actor = { path = "crates/embyx-fill-actor" }
embyx-merge = { path = "crates/embyx-merge", default-features = false }
embyx-transcode-worker = { path = "crates/embyx-transcode-worker" }
embyx-api = { path = "crates/embyx-api" }

# Foundation crates, as fav's workspace has them (the helpers copied from fav build on these).
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.20"
futures-util = { version = "0.3", default-features = false }
# `uuid.uuid4().hex` run ids (WP5) and multipart boundaries (WP4, Starlette's
# `secrets.token_hex(13)`): random bytes from the OS.
getrandom = "0.4"
# Insertion-ordered maps where Python relies on dict order (the monitor's in-memory ledger).
indexmap = "2"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
# Starlette's ETag: md5 of the modification time and size.
md-5 = "0.11"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
regex = "1"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
toml = { version = "0.9", features = ["preserve_order"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "fmt"] }
unicode-normalization = "0.1"
url = "2"
webpki-roots = "1"

# Checked in WP0 (docs/rewrite/API-COVERAGE.md).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "tls-rustls-ring-webpki"] }
# CloudDrive over gRPC: code generated at build time from the descriptor set extracted from the
# baseline's clouddrive_pb2.py (no .proto file, no protoc).
# `tls-ring` + `tls-webpki-roots`: `secure=True` (grpcio's bundled roots are the same Mozilla set).
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
# The HTML parser for JavBus, sukebei and the feed magnet tables (lxml in Python). html5ever and
# ego-tree are scraper's own (same versions): `embyx_clients::pyquery` drives the tree builder itself.
scraper = "0.29"
html5ever = "0.40"
ego-tree = "0.11"
# ElementTree / expat (feeds, the AVBase talent feed) and lxml's XML parser (pyquery's first try).
roxmltree = "0.21"
# jinjier's ranking database: sqlite3 `deserialize` (bundled SQLite) and `zipfile`.
rusqlite = { version = "0.39", features = ["bundled", "serialize"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# `str.casefold()` (full Unicode case folding) where AVBase compares work IDs.
caseless = "0.2"
# `response.text` for a charset other than UTF-8 / latin-1 (reqwest's own decoder).
encoding_rs = "0.8"
# Next-fire times of the archive scan cron (cronsim in Python).
croner = "4"
# The .strm watcher (watchdog in Python).
notify = { version = "8", default-features = false }
# renameat2(RENAME_NOREPLACE), hard links and flock without unsafe code.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
# The home worker's process control (WP15); the only place unsafe may be needed.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
# The impersonating client for AVBase (curl_cffi impersonate='chrome' in Python), BoringSSL.
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["webpki-roots", "tokio-rt", "gzip", "deflate", "brotli", "zstd", "charset", "cookies", "socks"] }
# wreq's HTTP/1 and HTTP/2 core, named only to read its error kind (the AVBase session's resend).
wreq-proto = { version = "=0.2.6", default-features = false }
wreq-util = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation"] }

[workspace.lints.rust]
# deny, not forbid: the home worker's process-control module (WP15) allows it locally;
# tools/check_tree.sh fails on `allow(unsafe_code)` anywhere else.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# CI runs clippy with `-D warnings`, so every warning below is an error there.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Placeholders never reach the `rust` branch (docs/CONVENTIONS.md).
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints that fight the code style more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
# Small, single binary; idle RSS is a goal (docs/rewrite/PLAN.md).
lto = "thin"
codegen-units = 1
strip = "debuginfo"
