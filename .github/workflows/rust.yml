name: Rust rewrite

# Checks for the Rust build (docs/rewrite/PLAN.md), on pull requests into `rust` and on
# pushes to it. Read-only by design: no job here builds or publishes an image, deploys or
# tags, and none has a token that could; the only outputs are workflow artifacts (the test
# listings and the Windows worker binary). The Python tree's own CI (ci.yml) runs as well.

on:
  push:
    branches: [ rust ]
  pull_request:
    branches: [ rust ]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Goldens and transcripts are made with this exact Python (docs/CONVENTIONS.md).
  UV_PYTHON: '3.13.18'

jobs:
  # The Python tree is the reference and must stay byte-identical to BASELINE.
  tree:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Python tree unchanged, no ignored Rust tests, unsafe confined
      run: tools/check_tree.sh

  python-tools:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tests
          POSTGRES_DB: embyx_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tests -d embyx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A disposable server: each scenario creates and drops its own database.
      EMBYX_MANAGER_TEST_DATABASE_URL: postgresql://tests@127.0.0.1:5432/embyx_test

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: '3.13.18'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Goldens match the Python baseline
      run: uv run python tools/goldens/generate.py --check

    - name: Effect transcripts match the Python baseline
      run: uv run python tools/scenarios/runner.py --check

    - name: CloudDrive descriptor matches the baseline stubs
      run: uv run python tools/codegen/clouddrive_descriptor.py --check

    - name: Tool self-tests
      run: uv run pytest tools/tests -q -p no:cacheprovider

    - name: Ruff (tools)
      run: |
        uv run ruff check tools
        uv run ruff format --check tools

  # Format, clippy, the tests (none may be ignored) and the test listing for the parity
  # check in one job, so they share one compile. Debug info is reduced to line tables: backtraces keep file and
  # line, and compiling and linking the test binaries gets faster (as in fav's CI).
  rust:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tests
          POSTGRES_DB: embyx_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tests -d embyx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests that need PostgreSQL create their own temporary database through this.
      EMBYX_MANAGER_TEST_DATABASE_URL: postgresql://tests@127.0.0.1:5432/embyx_test
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
    - uses: actions/checkout@v5

    - name: Install the pinned toolchain (rust-toolchain.toml)
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - uses: Swatinem/rust-cache@v2

    - name: Format
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    # The merge worker's tests run real ffmpeg (SVT-AV1 included), and its cross-check runs
    # the Python worker beside the Rust one (crates/embyx-merge/tests/ffmpeg_parity.rs); the
    # home worker's runs against the Python listener (crates/embyx-transcode-worker/tests).
    - name: Install ffmpeg
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends ffmpeg
        ffmpeg -hide_banner -encoders | grep -E 'libsvtav1|libx264'

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: '3.13.18'
        enable-cache: true

    - name: Install the Python environment
      run: uv sync --locked

    - name: Test (no test may be ignored)
      run: |
        set -o pipefail
        cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
        if grep -E '^test result: .* [1-9][0-9]* ignored' "$RUNNER_TEMP/cargo-test.log"; then
          echo "::error::ignored tests are not allowed"
          exit 1
        fi

    # Each line names its crate (cargo's own listing does not), so a claim is matched in its crate.
    - name: List compiled tests for the parity check
      run: python3 tools/parity/list_rust_tests.py --workspace --locked > "$RUNNER_TEMP/rust-tests.txt"

    - name: Collect the Python tests for the parity check
      run: uv run pytest --collect-only -q > "$RUNNER_TEMP/pytest-collected.txt"

    - name: Keep the listings for the parity check
      uses: actions/upload-artifact@v4
      with:
        name: parity-linux
        path: |
          ${{ runner.temp }}/rust-tests.txt
          ${{ runner.temp }}/pytest-collected.txt
        retention-days: 7

    # The unmodified front end, built, against the Rust server on a scratch database:
    # sign-in, every page, the settings round trip and a clean SIGTERM (tools/smoke).
    - uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Page smoke
      run: |
        (cd tools/smoke && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
        tools/smoke/run.sh

  # The home transcode worker runs on Windows (WP15). Its crate and the binary must build
  # there and their tests pass, real ffmpeg included. The binary is kept as a build artifact
  # for a look; it is not a release (WP16 decides how the worker is published).
  windows:
    runs-on: windows-latest

    env:
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
    - uses: actions/checkout@v5

    - name: Install the pinned toolchain (rust-toolchain.toml)
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - uses: Swatinem/rust-cache@v2

    # Chocolatey's `bin\ffmpeg.exe` is a shim that starts the real ffmpeg as its child, so
    # killing or suspending it leaves the real one running; the worker must start the real one.
    - name: Install ffmpeg
      run: |
        choco install ffmpeg -y --no-progress
        $real = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
        $real.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if (-not (& $real.FullName -hide_banner -encoders | Select-String libx264)) { throw 'ffmpeg has no libx264' }

    - name: The real ffmpeg comes first on PATH
      run: |
        (Get-Command ffmpeg).Source
        (Get-Command ffprobe).Source
        if ((Get-Command ffmpeg).Source -like '*chocolatey\bin*') { throw 'ffmpeg is the shim' }

    - name: Clippy (worker crate and binary)
      run: cargo clippy -p embyx-transcode-worker -p embyx-manager --all-targets --locked -- -D warnings

    - name: Test (worker crate and binary; no test may be ignored)
      shell: bash
      run: |
        set -o pipefail
        cargo test -p embyx-transcode-worker -p embyx-manager --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
        if grep -E '^test result: .* [1-9][0-9]* ignored' "$RUNNER_TEMP/cargo-test.log"; then
          echo "::error::ignored tests are not allowed"
          exit 1
        fi

    - name: List compiled tests for the parity check
      shell: bash
      run: python tools/parity/list_rust_tests.py -p embyx-transcode-worker -p embyx-manager --locked > "$RUNNER_TEMP/rust-tests-windows.txt"

    - name: Keep the listing for the parity check
      uses: actions/upload-artifact@v4
      with:
        name: parity-windows
        path: ${{ runner.temp }}/rust-tests-windows.txt
        retention-days: 7

    - name: Build the binary
      run: cargo build -p embyx-manager --release --locked

    - name: Keep the binary
      uses: actions/upload-artifact@v4
      with:
        name: embyx-manager-windows
        path: target/release/embyx-manager.exe
        retention-days: 14

  # Every claimed Rust test must be compiled on Linux or on Windows (tools/parity/parity.py).
  # Standard-library Python only: the listings come from the two jobs above.
  parity:
    needs: [ rust, windows ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        # The parity check reads the base branch's scope file.
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        pattern: parity-*
        path: ${{ runner.temp }}/parity

    - name: Test parity
      run: |
        listings="$RUNNER_TEMP/parity"
        base_args=()
        if [ -n "${BASE_REV}" ] && git show "${BASE_REV}:tools/parity/scope.toml" > "$RUNNER_TEMP/base-scope.toml" 2>/dev/null; then
          base_args=(--base-scope "$RUNNER_TEMP/base-scope.toml")
        else
          echo "no scope file at ${BASE_REV}; skipping the base comparison"
        fi
        python3 tools/parity/parity.py --check \
          --pytest-collected "$listings/parity-linux/pytest-collected.txt" \
          --rust-tests "$listings/parity-linux/rust-tests.txt" \
          --rust-tests "$listings/parity-windows/rust-tests-windows.txt" \
          "${base_args[@]}"
      env:
        BASE_REV: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
