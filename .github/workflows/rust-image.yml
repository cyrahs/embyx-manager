name: Rust image

# Publishes the Rust build's image for the deployment trial (DEPLOY.md), added on Max's go-ahead
# of 2026-11-16. It runs on pushes to `rust` and pushes two tags, `rust` and `rust-<sha>`, never
# the tag Flux follows, which ci.yml keeps building from `main` (the Python build); the cluster
# is pointed at an image by digest in nas-gitops, by hand. Rule 4 of tools/check_tree.sh holds
# this file to that and is the first step here, so a push that breaks the rule publishes nothing.

on:
  push:
    branches: [ rust ]

permissions:
  contents: read
  packages: write

concurrency:
  group: rust-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Tree check
      run: tools/check_tree.sh

    - uses: docker/setup-buildx-action@v3

    - name: Build Dockerfile.rust
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.rust
        platforms: linux/amd64
        push: false
        load: true
        provenance: false
        tags: embyx-manager:rust-ci
        cache-from: type=gha,scope=rust-image

    - name: The image runs the binary and carries ffmpeg with SVT-AV1
      run: |
        docker run --rm embyx-manager:rust-ci --help
        docker run --rm --entrypoint ffmpeg embyx-manager:rust-ci -hide_banner -encoders | grep -q libsvtav1
        docker run --rm --entrypoint ls embyx-manager:rust-ci /opt/embyx-manager/static/index.html

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The loaded image itself is pushed, not a second build, so what the registry holds is what
    # the step above ran.
    - name: Push the image that was just checked
      run: |
        docker tag embyx-manager:rust-ci "${IMAGE}:rust-${GITHUB_SHA}"
        docker tag embyx-manager:rust-ci "${IMAGE}:rust"
        docker push "${IMAGE}:rust-${GITHUB_SHA}"
        docker push "${IMAGE}:rust"

    - name: Digest
      run: |
        digest="$(docker buildx imagetools inspect "${IMAGE}:rust-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
        moving="$(docker buildx imagetools inspect "${IMAGE}:rust" --format '{{json .Manifest}}' | jq -r .digest)"
        [[ "${digest}" == sha256:* && "${digest}" == "${moving}" ]]
        pinned="${IMAGE}:rust-${GITHUB_SHA}"
        echo "${pinned}@${digest}" | tee -a "${GITHUB_STEP_SUMMARY}"
