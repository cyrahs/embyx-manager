name: Rust image

# Publishes the Rust build's image for the deployment trial (docs/rewrite/DEPLOY.md), added on
# Max's go-ahead of 2026-11-16. It runs on pushes to `rust`, which only happen by merging a pull
# request whose `rust.yml` checks passed. It writes two tags, `rust` and `rust-<sha>`, and never
# `latest`: Flux follows `latest`, which ci.yml keeps building from `main` (the Python build).
# The cluster is pointed at an image by digest in nas-gitops, by hand.

on:
  push:
    branches: [ rust ]

permissions:
  contents: read
  packages: write

concurrency:
  group: rust-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: docker/setup-buildx-action@v3

    - name: Build Dockerfile.rust
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.rust
        platforms: linux/amd64
        push: false
        load: true
        tags: embyx-manager:rust-ci
        cache-from: type=gha,scope=rust-image

    - name: The image runs the binary and carries ffmpeg with SVT-AV1
      run: |
        docker run --rm embyx-manager:rust-ci --help
        docker run --rm --entrypoint ffmpeg embyx-manager:rust-ci -hide_banner -encoders | grep -q libsvtav1
        docker run --rm --entrypoint ls embyx-manager:rust-ci /opt/embyx-manager/static/index.html

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push the image that was just checked
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.rust
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:rust
          ghcr.io/${{ github.repository }}:rust-${{ github.sha }}
        cache-from: type=gha,scope=rust-image

    - name: Digest
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        echo "ghcr.io/${GITHUB_REPOSITORY}:rust-${GITHUB_SHA}@${DIGEST}" | tee -a "${GITHUB_STEP_SUMMARY}"
