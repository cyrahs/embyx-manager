name: Tag python-final

# Run by hand, once: it marks the last Python build before the Python tree leaves `main`
# (docs/rewrite/PLAN.md, "Deployment and rollback", step 9). It puts the git tag `python-final`
# on the baseline commit and the image tag `python-final` on the Python image that ran in
# production, so the registry keeps that image after `latest` has moved on. Each step does
# nothing when its tag is already in place and fails when the tag points somewhere else.

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: python-final
  cancel-in-progress: false

env:
  COMMIT: 5a3c083468e9626e9b79d59ed3afb24ba7e6b4ff
  IMAGE: ghcr.io/${{ github.repository }}
  DIGEST: sha256:06fd3f0979c89c8f99d73df73c0506f80726ab2c3b7a0d1818d94f0d796f6208

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Git tag on the baseline commit
      run: |
        if [[ "$(tr -d '[:space:]' < BASELINE)" != "${COMMIT}" ]]; then
          echo "error: BASELINE is not ${COMMIT}"
          exit 1
        fi
        git cat-file -e "${COMMIT}^{commit}"
        # No force: a push can create the tag but never move it.
        existing="$(git ls-remote origin refs/tags/python-final | cut -f1)"
        if [[ -z "${existing}" ]]; then
          git push origin "${COMMIT}:refs/tags/python-final"
        elif [[ "${existing}" != "${COMMIT}" ]]; then
          echo "error: tag python-final already exists on ${existing}"
          exit 1
        fi
        now="$(git ls-remote origin refs/tags/python-final | cut -f1)"
        if [[ "${now}" != "${COMMIT}" ]]; then
          echo "error: tag python-final is on '${now}', expected ${COMMIT}"
          exit 1
        fi

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tag on the Python image
      shell: bash
      run: |
        inspect() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}'; }
        source_digest="$(inspect "${IMAGE}@${DIGEST}" | jq -r .digest)"
        if [[ "${source_digest}" != "${DIGEST}" ]]; then
          echo "error: ${IMAGE}@${DIGEST} reads back as '${source_digest}'"
          exit 1
        fi
        # Only "not found" counts as an absent tag; any other failure stops here, so a
        # registry hiccup can never lead to writing over a tag that exists.
        if out="$(inspect "${IMAGE}:python-final" 2>&1)"; then
          existing="$(jq -r .digest <<< "${out}")"
          if [[ "${existing}" != "${DIGEST}" ]]; then
            echo "error: image tag python-final already exists on ${existing}"
            exit 1
          fi
          echo "image tag python-final is already on ${DIGEST}"
        elif grep -qiE 'not found|manifest unknown' <<< "${out}"; then
          # Without --prefer-index=false a single-platform manifest would be wrapped in a
          # new index with another digest; with it the source is tagged as it is.
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:python-final" "${IMAGE}@${DIGEST}"
        else
          echo "error: could not read ${IMAGE}:python-final: ${out}"
          exit 1
        fi
        now="$(inspect "${IMAGE}:python-final" | jq -r .digest)"
        if [[ "${now}" != "${DIGEST}" ]]; then
          echo "error: image tag python-final is on '${now}', expected ${DIGEST}"
          exit 1
        fi
