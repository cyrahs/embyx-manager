name: Tag python-final

# Run by hand, once: it marks the last Python build before the Python tree leaves `main`
# (docs/rewrite/PLAN.md, "Deployment and rollback", step 9). It puts the git tag `python-final`
# on the baseline commit and the image tag `python-final` on the Python image that ran in
# production, so the registry keeps that image after `latest` has moved on. Each step does
# nothing when its tag is already in place and fails when the tag points somewhere else.

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: python-final
  cancel-in-progress: false

env:
  COMMIT: 5a3c083468e9626e9b79d59ed3afb24ba7e6b4ff
  IMAGE: ghcr.io/${{ github.repository }}
  DIGEST: sha256:06fd3f0979c89c8f99d73df73c0506f80726ab2c3b7a0d1818d94f0d796f6208

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Git tag on the baseline commit
      run: |
        [[ "$(tr -d '[:space:]' < BASELINE)" == "${COMMIT}" ]]
        git cat-file -e "${COMMIT}^{commit}"
        existing="$(git ls-remote origin refs/tags/python-final | cut -f1)"
        if [[ -z "${existing}" ]]; then
          git push origin "${COMMIT}:refs/tags/python-final"
        elif [[ "${existing}" != "${COMMIT}" ]]; then
          echo "error: tag python-final already exists on ${existing}"
          exit 1
        fi
        [[ "$(git ls-remote origin refs/tags/python-final | cut -f1)" == "${COMMIT}" ]]

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tag on the Python image
      run: |
        digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
        [[ "$(digest_of "${IMAGE}@${DIGEST}")" == "${DIGEST}" ]]
        existing="$(digest_of "${IMAGE}:python-final" 2>/dev/null || true)"
        if [[ -z "${existing}" ]]; then
          docker buildx imagetools create --tag "${IMAGE}:python-final" "${IMAGE}@${DIGEST}"
        elif [[ "${existing}" != "${DIGEST}" ]]; then
          echo "error: image tag python-final already exists on ${existing}"
          exit 1
        fi
        [[ "$(digest_of "${IMAGE}:python-final")" == "${DIGEST}" ]]
