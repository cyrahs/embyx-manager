name: Release

# The home transcode worker for Windows (docs/home-transcode.md): a tag `v*` builds
# `embyx-manager.exe` with the MSVC runtime linked in (no Visual C++ redistributable needed),
# writes its SHA-256 and attaches both to a GitHub Release named after the tag. CI's `windows`
# job builds the same exe on every pull request. Nothing here touches the image or the cluster.
#
# Two ways in: push a tag `v*`, or run the workflow by hand on `main` with the tag as input.
# The manual run builds the commit it runs on and creates the tag there together with the
# release; it refuses a tag that already exists.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create on this commit and release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-worker:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
    - uses: actions/checkout@v5

    # A manual run names the tag itself: only from `main`, only `vX.Y.Z`, and never a tag
    # that exists (a pushed tag is its own guard, the release step verifies it).
    - name: Check the tag of a manual run
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
          echo "error: a manual release runs on main, not on ${GITHUB_REF}"
          exit 1
        fi
        if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "error: the tag must look like v1.2.3, got '${TAG}'"
          exit 1
        fi
        # On its own line: a failed lookup stops the step instead of reading as "no such tag".
        existing="$(git ls-remote origin "refs/tags/${TAG}")"
        if [[ -n "${existing}" ]]; then
          echo "error: tag ${TAG} already exists"
          exit 1
        fi

    - name: Install the pinned toolchain (rust-toolchain.toml)
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - name: Build
      run: cargo build -p embyx-manager --release --locked

    - name: The exe runs and needs no Visual C++ runtime
      run: |
        $exe = 'target\release\embyx-manager.exe'
        & $exe --help
        if ($LASTEXITCODE -ne 0) { throw 'the exe does not run' }
        if (Select-String -Path $exe -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) { throw 'the exe imports VCRUNTIME140.dll' }

    - name: Checksum
      run: |
        $hash = (Get-FileHash target\release\embyx-manager.exe -Algorithm SHA256).Hash.ToLower()
        "$hash  embyx-manager.exe" | Out-File -Encoding ascii target\release\embyx-manager.exe.sha256
        Get-Content target\release\embyx-manager.exe.sha256

    - name: Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        notes="Home transcode worker for Windows (x86-64), built from ${GITHUB_SHA}.

        Install and update: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/home-transcode.md"
        # A pushed tag must exist and is used as it is; a manual run creates it on this commit.
        if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
          # Looked up again: a tag pushed during the build would otherwise take this exe.
          existing="$(git ls-remote origin "refs/tags/${TAG}")"
          if [[ -n "${existing}" ]]; then
            echo "error: tag ${TAG} appeared during the build"
            exit 1
          fi
          where=(--target "${GITHUB_SHA}")
        else
          where=(--verify-tag)
        fi
        gh release create "${TAG}" "${where[@]}" --title "embyx-manager ${TAG}" --notes "${notes}" \
          target/release/embyx-manager.exe target/release/embyx-manager.exe.sha256
