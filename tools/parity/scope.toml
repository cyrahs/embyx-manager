# Which work package ports which Python test (docs/rewrite/PLAN.md, "Per-WP scope").
# A whole file, a wildcard inside it, or one exact test; the most specific pattern wins.
# `status` follows the package: pending, in-progress, done. A done package may have
# nothing pending, and a package done on `rust` stays done (tools/parity/parity.py).

