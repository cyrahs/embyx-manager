# The move-in sweep (WP6): staged videos at the root and in brand directories are filed by
# AVID through the route the fill-actor directory feeds (a set travels together, in name
# order); an AVID the library already holds is parked once and its file left; an unreadable
# name is reported once; symbolic links and non-videos are ignored and the emptied brand
# directory stays; a rename that fails is contained and counted; a second pass is idempotent.
description = "move-in: file staged videos, park held AVIDs, report unreadable names"
operation = "move_in.steps"
clock = "2026-09-06T03:00:00+00:00"

[roots]
names = ["task", "library", "movein", "outside"]

[args]
move_in_root = "movein"
task_dir_path = "/task/intake"

[args.config]
src_dir = "task"
dst_dir = "library"
mapping = { intake = "sorted" }
min_size_mb = 0

[[args.faults]]
op = "rename"
path = "movein/GHI/GHI-805.mp4"
errno = 13
times = 1

[[args.steps]]
op = "run"

[[args.steps]]
op = "run"
args = { advance_seconds = 600 }

[[tree]]
path = "task/intake"
kind = "dir"

[[tree]]
path = "movein/DEF-801.mp4"
size = 1

[[tree]]
path = "movein/ABC/ABC-802-cd2.mp4"
size = 2

[[tree]]
path = "movein/ABC/ABC-802-cd1.mp4"
size = 3

[[tree]]
path = "library/sorted/ABC/ABC-803.mp4"
size = 4

[[tree]]
path = "movein/ABC/ABC-803.mp4"
size = 5

[[tree]]
path = "movein/holiday footage.mp4"
size = 6

[[tree]]
path = "movein/ABC/notes.txt"
text = "not a video"

[[tree]]
path = "outside/ABC-804.mp4"
size = 7

[[tree]]
path = "movein/ABC/ABC-804.mp4"
kind = "symlink"
target = "../../outside/ABC-804.mp4"

[[tree]]
path = "movein/ABC/deeper/ABC-806.mp4"
size = 8

[[tree]]
path = "movein/GHI/GHI-805.mp4"
size = 9

[database]
schema = "app"
