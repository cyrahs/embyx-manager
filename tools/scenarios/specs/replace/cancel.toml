# A replacement cancelled midway (换版, WP7): the poll is cancelled the moment CloudDrive has
# deleted the old copy (a shutdown), leaving the attempt claimed (archiving) with neither copy
# in the library. The next poll takes the claim back, finds the old copy gone and files the new
# one: a deletion that already happened counts as done.
description = "replace: cancelled after the old copy was deleted, finished by the next poll"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.config]
src_dir = "mount/115/task"
dst_dir = "mount/library"
mapping = { inbox = "sorted" }
min_size_mb = 0

[[args.steps]]
op = "poll"
args = { cancel_after = "DeleteFiles" }

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[tree]]
path = "mount/115/task/inbox/RPX-311/RPX-311.mp4"
size = 9

[[tree]]
path = "mount/library/sorted/RPX/RPX-311.mp4"
size = 4

