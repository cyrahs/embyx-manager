# Filing a replacement (换版, WP7). The copy being replaced is deleted through the CloudDrive API
# only once the new download is known to file as that AVID, and filing waits until the mount
# no longer shows it: the first poll deletes the old copy, the mount still lists it, so the
# claim is released; once the mount catches up the next poll files the new copy. A new
# download with no video, and one holding another title, leave the old copy where it is (the
# first exhausts the AVID, the second parks it for a human).
description = "replace: the old copy deleted only once the new one files as that AVID"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.config]
src_dir = "mount/115/task"
dst_dir = "mount/library"
mapping = { inbox = "sorted" }
min_size_mb = 0

[[args.steps]]
op = "poll"
args = { mount_keeps_deleted = true }

[[args.steps]]
op = "remove"
args = { path = "mount/library/sorted/RPA/RPA-301.mp4" }

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[tree]]
path = "mount/115/task/inbox/RPA-301/RPA-301.mp4"
size = 9

[[tree]]
path = "mount/115/task/inbox/RPB-302/info.nfo"
size = 1

[[tree]]
path = "mount/115/task/inbox/RPC-303/XYZ-888.mp4"
size = 8

[[tree]]
path = "mount/library/sorted/RPA/RPA-301.mp4"
size = 4

[[tree]]
path = "mount/library/sorted/RPB/RPB-302.mp4"
size = 4

[[tree]]
path = "mount/library/sorted/RPC/RPC-303.mp4"
size = 4

