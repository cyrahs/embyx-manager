# Starting a replacement (换版, WP7): the plan names the copy to delete and the directory the
# new download goes to; a fresh magnet from the resolvers, or the operator's pasted one, is
# submitted while the old copy stays; refusals (unreadable text, not held, already in progress,
# a magnet already tried, not a magnet) write nothing; a title with no magnet is parked; a
# pasted magnet CloudDrive already holds is a failed submit, parked too; a start cancelled the
# moment CloudDrive took the magnet leaves the row mid-way, and the tracker's next poll picks
# up every new download.
description = "replace: plan and start, refusals, parking and a cancelled start"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.sukebei]
"IPZ-661" = "magnet:?xt=urn:btih:B1B1B1B1B1B1B1B1B1B1B1B1B1B1B1B1B1B1B1B1&dn=IPZ-661"

[args.config]
src_dir = "mount/115/task"
dst_dir = "mount/library"
mapping = { inbox = "sorted" }
min_size_mb = 0

[[args.steps]]
op = "plan"
args = { text = "  ipz-661 [1080p] " }

[[args.steps]]
op = "plan"
args = { text = "XYZ-001" }

[[args.steps]]
op = "plan"
args = { text = "hello world" }

[[args.steps]]
op = "start"
args = { text = "IPZ-661" }

[[args.steps]]
op = "start"
args = { text = "IPZ-661" }

[[args.steps]]
op = "start"
args = { text = "ABC-123", magnet = "magnet:?xt=urn:btih:A1A1A1A1A1A1A1A1A1A1A1A1A1A1A1A1A1A1A1A1" }

[[args.steps]]
op = "start"
args = { text = "ABC-123", magnet = "not a magnet" }

[[args.steps]]
op = "start"
args = { text = "ABC-123", magnet = " magnet:?xt=urn:btih:C1C1C1C1C1C1C1C1C1C1C1C1C1C1C1C1C1C1C1C1&dn=ABC-123 " }

[[args.steps]]
op = "start"
args = { text = "NOM-401" }

[[args.steps]]
op = "start"
args = { text = "DUP-402", magnet = "magnet:?xt=urn:btih:D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1" }

[[args.steps]]
op = "start"
args = { text = "CXL-403", magnet = "magnet:?xt=urn:btih:E1E1E1E1E1E1E1E1E1E1E1E1E1E1E1E1E1E1E1E1", cancel_after = "AddOfflineFiles" }

[[args.steps]]
op = "plan"
args = { text = "CXL-403" }

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[tree]]
path = "mount/library/sorted/IPZ/IPZ-661.mp4"
size = 4

[[tree]]
path = "mount/library/sorted/ABC/ABC-123.mp4"
size = 4

[[tree]]
path = "mount/library/sorted/NOM/NOM-401.mp4"
size = 4

[[tree]]
path = "mount/library/sorted/DUP/DUP-402.mp4"
size = 4

[[tree]]
path = "mount/library/sorted/CXL/CXL-403.mp4"
size = 4

