# A replacement whose library is not on the CloudDrive mount (换版, WP7): the old copy cannot be
# deleted through the API, so the title is parked for a human with both copies kept.
description = "replace: the old copy outside the CloudDrive mount"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount", "library"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.config]
src_dir = "mount/115/task"
dst_dir = "library"
mapping = { inbox = "sorted" }
min_size_mb = 0

[[args.steps]]
op = "poll"

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[tree]]
path = "mount/115/task/inbox/ROU-331/ROU-331.mp4"
size = 9

[[tree]]
path = "library/sorted/ROU/ROU-331.mp4"
size = 4

