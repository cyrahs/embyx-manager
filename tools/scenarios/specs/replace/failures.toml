# Replacement failures (换版, WP7). CloudDrive refusing the delete of the old copy is logged and
# the claim released, with both copies kept; the next poll deletes it and files the new one. An
# old copy the mount shows but CloudDrive's listing of its directory does not (the directory is
# not found) is never deleted, so filing waits, poll after poll.
description = "replace: a refused delete, an old copy CloudDrive cannot list"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.config]
src_dir = "mount/115/task"
dst_dir = "mount/library"
mapping = { inbox = "sorted" }
min_size_mb = 0

[[args.steps]]
op = "poll"

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[tree]]
path = "mount/115/task/inbox/RFA-321/RFA-321.mp4"
size = 9

[[tree]]
path = "mount/115/task/inbox/RFB-322/RFB-322.mp4"
size = 9

