# The app shell with a token and the SPA (WP4): health, the login probe, bearer parsing,
# the config API (masking, versions, refusals, request validation before and after auth),
# both connection tests against the fakes (success, refusals, RPC and Emby failures), the
# 64 KiB limit, no-store, FastAPI's own 404/405 answers, and the SPA's files, fallback,
# redirect, validators and byte ranges. The transcode listener's shell answers its own 404.
description = "api: shell, auth, config API, connection tests, size limit, SPA hosting"
operation = "api.exchange"
volatile = ["rows.app_config.updated_at"]

roots.names = ["static"]

[[tree]]
path = "static/index.html"
text = "<!doctype html><title>embyx</title><div id=\"root\"></div>\n"

[[tree]]
path = "static/assets/app.js"
text = "console.log('embyx');\n"

[[tree]]
path = "static/assets/style.css"
text = "body { color: #0b0; }\n"

[[tree]]
path = "static/favicon.svg"
text = "<svg xmlns=\"http://www.w3.org/2000/svg\"/>\n"

[[tree]]
path = "static/robots.txt"
text = "0123456789"

[[tree]]
path = "static/guide/index.html"
text = "<p>docs</p>\n"

[[tree]]
path = "static/data/blob.bin"
text = "binary"

[[tree]]
path = "static/data/report.JSON"
text = "{}"

[[tree]]
path = "static/data/bundle.js.gz"
text = "zipped"

