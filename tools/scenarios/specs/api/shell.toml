[clouddrive]
directories = ["/115"]
errors = [
    { method = "GetSystemInfo", code = "UNAUTHENTICATED", details = "token rejected" },
    { method = "GetSubFiles", code = "NOT_FOUND", details = "no such directory" },
]

[emby]
routes = [
    { method = "GET", path = "/emby/System/Info", status = 200, body = { ServerName = "embyx", Version = "4.10.0.40", Id = "srv" }, times = 1 },
    { method = "GET", path = "/emby/System/Info", status = 401, body = "unauthorized", times = 1 },
    { method = "GET", path = "/emby/System/Info", status = 500, body = { error = "boom" }, times = 1 },
    { method = "GET", path = "/emby/System/Info", status = 200, body = { Version = "4.9" }, times = 1 },
]
