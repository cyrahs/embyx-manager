# The monitor and playlists routers (WP9) over the real repositories: pipeline status, a
# trigger refused by readiness and one refused by the token, runs by pipeline and limit,
# the ledger list (state filter, paging), detail, ignore and resume, retry and magnet with
# nothing to submit to, the tracker card, the subscription registry (create, conflict,
# unknown category, extra field, update, delete) and the playlists with their missing
# titles and the enabled switch. Request validation answers its fixed 422 after the token.
description = "api: monitor and playlists routers over PostgreSQL"
operation = "api.exchange"
volatile = [
    "rows.feed_subscriptions.created_at",
    "rows.feed_subscriptions.updated_at",
    "rows.archive_acquisitions.updated_at",
    "rows.archive_magnet_attempts.updated_at",
    "rows.playlists.updated_at",
]

[database]
schema = "app"
tables = ["feed_subscriptions", "archive_acquisitions", "archive_magnet_attempts", "playlists", "pipeline_runs"]
sql = [
    """INSERT INTO app_config (section, value_json, version, updated_at) VALUES
    ('rss', '{"categories": [{"label": "rank", "task_dir_path": "/115/rank"}, {"label": "actor", "task_dir_path": "/115/actor"}]}', 2, '2026-09-01T00:00:00+00:00'),
    ('mapping', '{"enabled": true}', 1, '2026-09-01T00:00:00+00:00')""",
    """INSERT INTO feed_subscriptions (kind, category, enabled, url, talent_id, name, aliases_json, cursor_json, seed_pending, last_polled_at, last_error, created_at, updated_at) VALUES
    ('rss', 'rank', TRUE, 'https://feeds.example/rank.xml', NULL, 'Rank feed', '[]', '["a", "b", "c"]', FALSE, '2026-09-02T01:02:03.250000Z', NULL, '2026-09-01T00:00:00Z', '2026-09-02T01:02:03Z'),
    ('avbase_talent', 'actor', FALSE, NULL, 4242, '演员', '["Alias One"]', '[]', TRUE, NULL, 'feed fetch failed: 503', '2026-09-01T00:00:00Z', '2026-09-01T00:00:00Z')""",
    """INSERT INTO archive_acquisitions (avid, state, source, note, task_dir_path, release_date, next_action_at, created_at, updated_at, archived_paths_json) VALUES
    ('ABC-001', 'downloading', 'rss_rank', NULL, '/115/rank', '2026-08-30', NULL, '2026-09-01T00:00:00Z', '2026-09-01T00:00:00Z', '[]'),
    ('ABC-002', 'resolve_failed', 'rss_actor', 'no magnet found', '/115/actor', NULL, '2026-09-03T00:00:00Z', '2026-09-01T00:00:00Z', '2026-09-02T00:00:00Z', '[]'),
    ('ABC-003', 'archived', 'manual', NULL, '/115/rank', NULL, NULL, '2026-09-01T00:00:00Z', '2026-09-03T00:00:00Z', '["rank/ABC/ABC-003.mp4"]')""",
    """INSERT INTO archive_magnet_attempts (avid, attempt_no, magnet, info_hash, magnet_source, state, progress, submitted_at, updated_at, error) VALUES
    ('ABC-001', 1, 'magnet:?xt=urn:btih:0101010101010101010101010101010101010101&dn=ABC-001', '0101010101010101010101010101010101010101', 'sukebei', 'stalled', 12.5, '2026-09-01T00:00:00Z', '2026-09-01T06:00:00Z', 'stalled'),
    ('ABC-001', 2, 'magnet:?xt=urn:btih:1111111111111111111111111111111111111111&dn=ABC-001', '1111111111111111111111111111111111111111', 'javbus', 'downloading', 40.0, '2026-09-01T07:00:00Z', '2026-09-01T08:00:00.5Z', NULL),
    ('ABC-003', 1, 'magnet:?xt=urn:btih:0303030303030303030303030303030303030303&dn=ABC-003', '0303030303030303030303030303030303030303', 'manual', 'archived', 100.0, '2026-09-01T00:00:00Z', '2026-09-03T00:00:00Z', NULL)""",
    """INSERT INTO pipeline_runs (run_id, pipeline, trigger, state, started_at, finished_at, stats_json, errors_json, log_json) VALUES
    ('run-1', 'rss', 'scheduled', 'completed', '2026-09-01T00:00:00Z', '2026-09-01T00:00:05.123456Z', '{"seen": 3, "new": 1}', '[]', '["polled 2 feeds", "queued ABC-001"]'),
    ('run-2', 'archive', 'manual', 'failed', '2026-09-02T00:00:00Z', '2026-09-02T00:01:00Z', '{}', '["mount is not readable"]', '[]'),
    ('run-3', 'rss', 'manual', 'cancelled', '2026-09-03T00:00:00Z', '2026-09-03T00:00:01Z', '{"seen": 0}', '[]', '["stopped"]')""",
    """INSERT INTO playlists (key, kind, note, name, enabled, entries_json, present_json, missing_json, emby_playlist_id, last_synced_at, last_error, created_at, updated_at) VALUES
    ('rank-1', 1, '月榜', 'Monthly', TRUE, '[[1, "ABC-001", "One"], [2, "ABC-002", "Two"], [3, "ABC-004", "Four"], [4, "ABC-003", "Three"]]', '["ABC-003"]', '["ABC-001", "ABC-002", "ABC-004"]', 'emby-77', '2026-09-04T00:00:00Z', NULL, '2026-09-01T00:00:00Z', '2026-09-04T00:00:00Z'),
    ('rank-2', 2, '年榜', 'Yearly', FALSE, '[]', '[]', '[]', NULL, NULL, 'sync failed', '2026-09-01T00:00:00Z', '2026-09-01T00:00:00Z')""",
]

