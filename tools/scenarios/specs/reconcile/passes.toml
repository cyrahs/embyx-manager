# The reconcile scan over four passes (WP6): a folder is filed only once it looked the same
# twice, a growing one waits a pass longer; an AVID the tracker owns is left alone; a leftover
# of an archived AVID is filed without touching its row; a folder with two AVIDs and one with
# none are reported once each, by folder; a folder whose AVID the library already holds is
# parked as needs_attention once (and not again for a row already parked); a junk folder stays;
# a nested route and a priority route are scanned as routes of their own; a missing route
# source is skipped. The rows pin what the ledger records.
description = "reconcile: settle, file, park and report across passes"
operation = "reconcile.steps"
clock = "2026-09-04T03:00:00+00:00"

[roots]
names = ["task", "library"]

[args.config]
src_dir = "task"
dst_dir = "library"
mapping = { intake = "sorted", "intake/rank" = "sorted/rank", gone = "elsewhere" }
priority_mapping = { vip = "starred" }
min_size_mb = 0

[[args.steps]]
op = "run"

[[args.steps]]
op = "write"
args = { path = "task/intake/ABC-603 growing/ABC-603.mp4", size = 99 }

[[args.steps]]
op = "run"
args = { advance_seconds = 3600 }

[[args.steps]]
op = "run"
args = { advance_seconds = 3600 }

[[args.steps]]
op = "run"
args = { advance_seconds = 3600 }

