# Every way one folder can end (WP6): filed and deleted with its extras, a nested video, the
# multi-part shapes (indexed, unindexed lead, letters), a 4K cut beating its smaller twin, a
# phone rip dropped, a "(1)" copy deleted, and the folders left for an operator: two AVIDs,
# no AVID, an unexpected AVID, unrelated videos, a phone rip too large, a path that is not a
# directory. Then the two-step path the tracker takes (inspect, then file) and a loose group.
description = "archive: the outcome of archive_folder for each folder shape"
operation = "archive.steps"

[roots]
names = ["task", "library"]

[args.config]
src_dir = "task"
dst_dir = "library"
mapping = { intake = "sorted" }
brand_mapping = { special = ["SPC"] }
min_size_mb = 0

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/ABC-101 release", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/nested", dst = "sorted" }

[[args.steps]]
