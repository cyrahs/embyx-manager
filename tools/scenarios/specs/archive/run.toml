# The full scan (WP6): priority routes first, so the priority copy claims an AVID the normal
# route also downloaded; a route whose source is missing is skipped; a plain file in a route
# is not a folder; loose videos are grouped by AVID (an unreadable one is skipped) and filed
# without a folder to delete; a route nested in another is left to its own scan, also when
# it is deeper.
description = "archive: run() over every route"
operation = "archive.steps"

[roots]
names = ["task", "library"]

[args.config]
src_dir = "task"
dst_dir = "library"
mapping = { intake = "sorted", "intake/rank" = "sorted/rank", "intake/deep/new" = "sorted/new", gone = "elsewhere" }
priority_mapping = { vip = "starred" }
min_size_mb = 0

[[args.steps]]
op = "run"

[[args.steps]]
op = "run"

