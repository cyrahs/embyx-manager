# Name collisions (WP6): the library already holds the AVID, or only one part of a set, so
# nothing moves; a hard-linked video keeps its link count when filed; a symbolic link to a
# folder files the folder's video but cannot be removed itself; a min-size threshold makes
# a folder junk and leaves it in place.
description = "archive: destinations that already exist, links, the size threshold"
operation = "archive.steps"

[roots]
names = ["task", "library", "outside"]

[args.config]
src_dir = "task"
dst_dir = "library"
mapping = { intake = "sorted" }
min_size_mb = 1

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/again", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/part-taken", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/hardlinked", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/linked", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/ads", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/longer", dst = "sorted" }

[[args.steps]]
op = "archive_loose_group"
args = { avid = "ABC-111", videos = ["task/intake/ABC-111.mp4"], dst = "sorted" }

