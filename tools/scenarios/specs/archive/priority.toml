# Priority routes (WP6): a priority arrival promotes every part of the normal copy and then
# finds its own destination taken; promotion keeps both when the priority side already holds
# the name; a normal arrival skips an AVID the priority side holds; brand-mapped brands skip
# both guards; `library_holdings` promotes for a priority task directory and reports every
# copy otherwise; `replaced_copies` ignores absolute, `..` and foreign paths; the routes a
# task directory maps to.
description = "archive: priority promotion, the library check, replaced copies"
operation = "archive.steps"

[roots]
names = ["task", "library"]

[args.config]
src_dir = "task"
dst_dir = "library"
mapping = { intake = "sorted", extra = "other" }
priority_mapping = { vip = "starred" }
brand_mapping = { special = ["SPC"] }
min_size_mb = 0

[[args.steps]]
op = "archive_folder"
args = { folder = "task/vip/ABC-201 4k", dst = "starred", priority = true }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/vip/ABC-202", dst = "starred", priority = true }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/ABC-203", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/intake/SPC-204", dst = "sorted" }

[[args.steps]]
op = "archive_folder"
args = { folder = "task/vip/ABC-205", dst = "starred", priority = true }

[[args.steps]]
op = "library_holdings"
args = { avid = "ABC-206", task_dir = "/task/intake" }

[[args.steps]]
op = "library_holdings"
args = { avid = "ABC-206", task_dir = "/task/vip" }

[[args.steps]]
op = "library_holdings"
args = { avid = "ABC-207", task_dir = "/elsewhere/entirely" }

[[args.steps]]
op = "library_holdings"
args = { avid = "ABC-207" }

[[args.steps]]
op = "library_holdings"
args = { avid = "NOBRAND", task_dir = "/task/vip" }

[[args.steps]]
op = "replaced_copies"
args = { avid = "ABC-207", paths = ["other/ABC/ABC-207.mp4", "other/ABC/ABC-207.mp4", "/abs/ABC-207.mp4", "other/../other/ABC/ABC-207.mp4", "other/ABC/ABC-2070.mp4", "other/ABC/./ABC-207.mp4", "sorted/ABC/missing.mp4"] }

[[args.steps]]
op = "route_for_task_dir"
args = { task_dir = "/task/intake" }

[[args.steps]]
op = "route_for_task_dir"
args = { task_dir = "/task/vip/" }

[[args.steps]]
op = "route_for_task_dir"
args = { task_dir = "task/extra" }

[[args.steps]]
op = "route_for_task_dir"
args = { task_dir = "/intake/task" }

[[args.steps]]
op = "route_for_task_dir"
args = { task_dir = "/" }

[[args.steps]]
op = "route_for_task_dir"
args = { task_dir = "" }

