# Full sync (WP8): the first run mirrors every flat `.strm` into its title directory (a copy
# whose bytes differ is replaced even with the same time), deletes strays (a source that is
# gone, a strm left in a directory its ID no longer maps to) with the metadata they own, keeps
# metadata no strm claims, and removes directories left without a strm. The second run over
# the now in-sync tree changes nothing. A source written later is copied again; a source
# removed takes its title directory with it.
description = "mapping: run_full() mirrors, deletes strays, then an in-sync tree changes nothing"
operation = "mapping.steps"

[roots]
names = ["flat", "emby"]

[args.config]
src_dir = "flat"
dst_dir = "emby"

[[args.steps]]
op = "full"

[[args.steps]]
op = "full"

[[args.steps]]
op = "write"
args = { path = "flat/a/ABC-101.strm", text = "/cloud/a/ABC-101.v2.mp4", mtime = 1767225660 }

[[args.steps]]
op = "remove"
args = { path = "flat/b/c/DEF-201.strm" }

[[args.steps]]
op = "full"

[[args.steps]]
op = "full"

