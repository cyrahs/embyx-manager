# A CloudDrive move stopped between each pair of its steps (WP11): a crash in front of the
# operation's prepared, its submitting, the MoveFile call, its verifying and the final write
# (result and operation together), and a cancel right after MoveFile answered. A new service
# recovers each operation from the state it was left in: never submitted is a failure, an
# interrupted submission is observed (moved: succeeded; untouched: unknown until the grace has
# passed, then not observed), verifying is observed again. Apply returns what recovery stored.
description = "fill_actor: a crash or cancel between the steps of a CloudDrive move, then recovery"
operation = "fill_actor.service"
clock = "2026-09-17T03:00:00+00:00"

[roots]
names = ["actor", "additional", "movein"]

[args]
catalog = { actor = ["ABC-701", "ABC-702", "ABC-703", "ABC-704", "ABC-705", "ABC-706"] }
cloud = { strm_mount_prefix = "/mnt/cd2", source_api_roots = ["/lib/src"], move_in_api_root = "/lib/movein" }

[[args.steps]]
op = "scan"

[[args.steps]]
op = "apply"
args = { files = ["ABC-701.mp4"], advance_seconds = 60, crash = { repository = "save_cloud_move_operation", state = "prepared" } }

[[args.steps]]
op = "restart"

[[args.steps]]
op = "reconcile"
args = { advance_seconds = 60 }

[[args.steps]]
op = "apply"
args = { files = ["ABC-701.mp4"] }

[[args.steps]]
op = "apply"
args = { files = ["ABC-702.mp4"], advance_seconds = 60, crash = { repository = "save_cloud_move_operation", state = "submitting" } }

[[args.steps]]
op = "restart"

[[args.steps]]
op = "reconcile"
args = { advance_seconds = 60 }

[[args.steps]]
op = "apply"
args = { files = ["ABC-702.mp4"] }

[[args.steps]]
op = "apply"
args = { files = ["ABC-703.mp4"], advance_seconds = 60, crash = { mover = "move_file" } }

[[args.steps]]
op = "restart"

[[args.steps]]
op = "reconcile"
args = { advance_seconds = 60 }

[[args.steps]]
op = "apply"
args = { files = ["ABC-703.mp4"] }

[[args.steps]]
op = "apply"
args = { files = ["ABC-704.mp4"], advance_seconds = 60, crash = { repository = "save_cloud_move_operation", state = "verifying" } }

[[args.steps]]
op = "restart"

[[args.steps]]
op = "reconcile"
args = { advance_seconds = 60 }

[[args.steps]]
op = "apply"
args = { files = ["ABC-704.mp4"] }

[[args.steps]]
op = "apply"
args = { files = ["ABC-705.mp4"], advance_seconds = 60, crash = { repository = "finalize_cloud_move" } }

[[args.steps]]
op = "restart"

[[args.steps]]
op = "reconcile"
args = { advance_seconds = 60 }

[[args.steps]]
op = "apply"
args = { files = ["ABC-705.mp4"] }

[[args.steps]]
op = "apply"
args = { files = ["ABC-706.mp4"], advance_seconds = 60, cancel_after = { mover = "move_file" } }

[[args.steps]]
op = "reconcile"
args = { advance_seconds = 60 }

[[args.steps]]
op = "apply"
args = { files = ["ABC-706.mp4"] }

[[args.steps]]
op = "reconcile"
args = { advance_seconds = 900 }

[[args.steps]]
op = "apply"

[[tree]]
path = "additional/ABC/ABC-701.strm"
text = "/mnt/cd2/lib/src/ABC/ABC-701.mp4"

