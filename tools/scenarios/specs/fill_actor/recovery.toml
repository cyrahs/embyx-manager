# Recovery from every journal state (WP11): the journal rows a build left behind (written here
# through the repository, as either build writes them) and the disk as a crash left it. One title
# per case: prepared with the source alone, with source and destination one inode, with a
# foreign destination (source gone: rolled back; source there: a conflict left for a person), with
# nothing; linked or source_removed with the destination alone, with nothing, with the source
# rewritten, with a foreign destination, with both still linked; the quarantine name holding the
# file (destination linked or missing) or a foreign file (destination there or not); reconciled
# (left alone). Reconcile runs twice, then apply over the whole plan.
description = "fill_actor: reconcile from each journal state the disk can be in"
operation = "fill_actor.service"
clock = "2026-09-14T03:00:00+00:00"

[roots]
names = ["actor", "additional", "movein"]

[args]
catalog = { actor = ["ABC-401", "ABC-402", "ABC-403", "ABC-404", "ABC-405", "ABC-406", "ABC-407", "ABC-408", "ABC-409", "ABC-410", "ABC-411", "ABC-412", "ABC-413", "ABC-414", "ABC-415", "ABC-416"] }

[[args.steps]]
op = "scan"

[[args.steps]]
op = "journal"
args = { file = "ABC-401.mp4", states = ["prepared"] }

[[args.steps]]
op = "journal"
args = { file = "ABC-402.mp4", states = ["prepared"] }

[[args.steps]]
op = "link"
args = { target = "additional/ABC/ABC-402.mp4", path = "movein/ABC-402.mp4" }

[[args.steps]]
op = "journal"
args = { file = "ABC-403.mp4", states = ["prepared", "linked"] }

[[args.steps]]
op = "rename"
args = { src = "additional/ABC/ABC-403.mp4", dst = "movein/ABC-403.mp4" }

[[args.steps]]
op = "journal"
args = { file = "ABC-404.mp4", states = ["prepared", "linked", "source_removed"] }

[[args.steps]]
op = "rename"
args = { src = "additional/ABC/ABC-404.mp4", dst = "movein/ABC-404.mp4" }

[[args.steps]]
op = "journal"
args = { file = "ABC-405.mp4", states = ["prepared"] }

[[args.steps]]
op = "remove"
args = { path = "additional/ABC/ABC-405.mp4" }

[[args.steps]]
