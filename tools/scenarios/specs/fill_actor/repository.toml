# The fill-actor repository (fill_actor/postgres_repository.py) step by step: the rows a plan,
# its local and CloudDrive candidates, move results, the job queue with its leases and
# progress, apply jobs, the move journal and the CloudDrive move operations store, and the
# rows seeded below as the Python build wrote them (a plan dated in +09:00 from before the
# optional fields, a job with the pre-progress defaults, a CloudDrive candidate and its
# unresolved operation), read back and carried on. Every timestamp comes from the steps, so
# nothing is volatile; the rows pin the `public_json`, `result_json`, `cloud_file_json`,
# `actor_ids_json` and `candidate_ids_json` bytes.
description = "fill_actor: plans, jobs, journals and cloud moves through the repository"
operation = "fill_actor.repository"
clock = "2026-07-13T10:00:00+00:00"

[database]
schema = "app"
tables = [
    "fill_actor_plans",
    "fill_actor_candidates",
    "fill_actor_move_results",
    "fill_actor_jobs",
    "fill_actor_apply_jobs",
    "fill_actor_move_journal",
    "fill_actor_cloud_move_operations",
]
sql = [
    '''INSERT INTO fill_actor_plans (plan_id, revision, public_json, created_at, expires_at) VALUES ('legacy', 'legacy-r', '{"plan_id":"legacy","revision":"legacy-r","created_at":"2026-07-13T19:00:00+09:00","expires_at":"2026-07-13T20:00:00+09:00","actors":[{"actor_id":"old","scraped_count":1,"video_ids":["OLD-001"],"error_code":null}],"videos":[{"video_id":"OLD-001","actor_ids":["old"],"state":"magnet_found","existing_files":[],"move_candidates":[{"candidate_id":"legacy-c","video_id":"OLD-001","file_name":"OLD-001.strm","source_label":"additional-1","destination_conflict":false}],"warnings":[]}]}', '2026-07-13T10:00:00+00:00', '2026-07-13T11:00:00+00:00')''',
    '''INSERT INTO fill_actor_candidates (plan_id, candidate_id, video_id, source_path, source_root, destination_path, fingerprint_device, fingerprint_inode, fingerprint_size, fingerprint_mtime_ns, fingerprint_ctime_ns, candidate_kind, mapping_sha256, cloud_source_path, cloud_destination_dir, cloud_file_json) VALUES ('legacy', 'legacy-c', 'OLD-001', '/mapping/OLD/OLD-001.strm', '/mapping', '/move-in/OLD/OLD-001.strm', 66306, 1234567, 52, 1783936800123456789, 1783936800123456789, 'cloud_strm', 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', '/cloud/library/source-b/OLD/OLD-001.mp4', '/cloud/library/destination/OLD', '{"hashes":{"2":"SHA1","中":"é"},"id":"old-file","name":"OLD-001.mp4","path":"/cloud/library/source-b/OLD/OLD-001.mp4","size":1073741824000,"write_time":1783936800123456789}')''',
    '''INSERT INTO fill_actor_cloud_move_operations (plan_id, candidate_id, attempt_id, source_path, destination_dir, state, updated_at, error_code) VALUES ('legacy', 'legacy-c', 'legacy-attempt', '/cloud/library/source-b/OLD/OLD-001.mp4', '/cloud/library/destination/OLD', 'unknown', '2026-07-13T10:30:00.5+00:00', 'cloud_move_interrupted')''',
    '''INSERT INTO fill_actor_jobs (job_id, operation, state, created_at, updated_at, plan_id) VALUES ('legacy-job', 'create_plan', 'running', '2026-07-13T09:00:00+00:00', '2026-07-13T09:00:00+00:00', 'legacy')''',
]

