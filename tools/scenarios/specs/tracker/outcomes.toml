# Tracker outcomes (WP7) over three polls against the ledger in PostgreSQL, the fake CloudDrive
# and the mount: a finished download filed and its task cleared with an archived one from
# before; a junk download (no video) dropped with its data and the next magnet submitted; an
# errored one with no other magnet exhausted on its release schedule; a stalled one whose next
# magnet CloudDrive already holds elsewhere ("任务已存在"), so it errors too and the AVID is
# exhausted on the stall fallback; a task CloudDrive lost (next magnet submitted); a lost task
# whose folder is on the mount filed as an orphan; one just submitted left alone (grace);
# progress recorded; a finished task the mount does not show yet released, then filed once the
# folder appears; a task with no attempt left alone. The second poll sees the new submissions.
description = "tracker: finished, junk, error, stalled, lost, orphaned and waiting downloads"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.config]
src_dir = "mount/115/task"
dst_dir = "mount/library"
mapping = { inbox = "sorted" }
min_size_mb = 0

[[args.steps]]
op = "poll"

[[args.steps]]
op = "poll"
args = { advance_seconds = 600 }

[[args.steps]]
op = "write"
args = { path = "mount/115/task/inbox/WAI-009/WAI-009.mp4", size = 6 }

[[args.steps]]
op = "poll"
args = { advance_seconds = 600 }

[[tree]]
path = "mount/115/task/inbox/FIN-001/FIN-001.mp4"
size = 5

[[tree]]
path = "mount/115/task/inbox/JNK-002/readme.txt"
size = 9

[[tree]]
path = "mount/115/task/inbox/ORP-006 [hd]/ORP-006.mp4"
size = 7

[[tree]]
path = "mount/library/sorted/OLD/OLD-010.mp4"
size = 4

