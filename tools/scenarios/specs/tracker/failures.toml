# Tracker failures (WP7): a task listing CloudDrive refuses ends the poll before anything is
# touched; a refresh of the mount that fails is logged and the folder filed anyway; a rename
# that fails releases the claim and the next poll files the folder; a folder holding another
# title is parked for a human; an errored download past the attempt cap exhausts the AVID with
# a candidate left over; an AVID an operator ignored is never filed or retried, though its
# errored task is still dropped, and a failure to drop it is logged and costs nothing else.
description = "tracker: CloudDrive errors, a failed rename, a wrong title, the attempt cap, ignored rows"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.config]
src_dir = "mount/115/task"
dst_dir = "mount/library"
mapping = { inbox = "sorted" }
min_size_mb = 0
max_attempts = 3

[[args.faults]]
op = "rename"
path = "mount/115/task/inbox/FIN-101/FIN-101.mp4"
errno = 5
times = 1

[[args.steps]]
op = "poll"

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[tree]]
path = "mount/115/task/inbox/RFR-102/RFR-102.mp4"
size = 3

[[tree]]
path = "mount/115/task/inbox/FIN-101/FIN-101.mp4"
size = 4

[[tree]]
path = "mount/115/task/inbox/NAT-103/XYZ-999.mp4"
size = 6

[[tree]]
