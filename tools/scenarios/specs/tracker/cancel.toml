# Cancelling the tracker (WP7). A poll asked to stop before it starts lists nothing. A stop
# requested while a download is being filed lets that folder finish and its row settle, then
# ends the poll before the next attempt, so the vanished-task sweep and the clearing of
# archived tasks wait for the next poll. A poll cancelled the moment CloudDrive has dropped a
# junk download's task (a shutdown) leaves the next magnet submitted and the archived tasks
# listed; the poll after it carries on from the ledger.
description = "tracker: stop before, stop between attempts, cancelled after a task removal"
operation = "tracker.steps"
clock = "2026-09-10T03:00:00+00:00"

[roots]
names = ["mount"]

[args]
mount = "mount"
task_dirs = ["/115/task/inbox"]

[args.config]
src_dir = "mount/115/task"
dst_dir = "mount/library"
mapping = { inbox = "sorted" }
min_size_mb = 0

[[args.stops]]
op = "rename"
path = "mount/115/task/inbox/CAA-201/CAA-201.mp4"

[[args.steps]]
op = "poll"
args = { stop_before = true }

[[args.steps]]
op = "poll"

[[args.steps]]
op = "poll"
args = { advance_seconds = 60, cancel_after = "RemoveOfflineFiles" }

[[args.steps]]
op = "poll"
args = { advance_seconds = 60 }

[[tree]]
path = "mount/115/task/inbox/CAA-201/CAA-201.mp4"
size = 3

[[tree]]
path = "mount/115/task/inbox/CAB-202/CAB-202.mp4"
size = 4

[[tree]]
path = "mount/115/task/inbox/JNK-203/sample.txt"
size = 1

